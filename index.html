<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         CANVAS MATRIX
    ========================================== -->

    <canvas id="matrixCanvas"></canvas>


    <!-- =========================================
         BACKGROUND BINTANG
    ========================================== -->

    <div id="stars"></div>


    <!-- =========================================
         BAGIAN 1
         I'M / MY
    ========================================== -->

    <section id="intro">

        <div id="introText">
            I'M
        </div>

    </section>


    <!-- =========================================
         BAGIAN 2
         HEART PARTICLE
    ========================================== -->

    <section id="particleHeart">

        <div class="particle-heart"></div>

    </section>


    <!-- =========================================
         BAGIAN 3
         CARD AWAL
    ========================================== -->

    <section id="loveCard">

        <div class="mini-card">

            <div class="hands">
                🫶
            </div>

            <div class="mini-heart">
                ❤️
            </div>

        </div>

    </section>


    <!-- =========================================
         BAGIAN 4
         PESAN + FOTO
    ========================================== -->

    <section id="memorySection">

        <!-- Pesan -->

        <div class="message-box">

            <span class="message-heart">
                💕
            </span>

            <p id="messageText">
                Aku tidak pernah berniat menyakitimu sayang ❤️
            </p>

        </div>


        <!-- Foto -->

        <div class="photo-frame">

            <img id="photoLeft" src="gambar_1 (1).jpeg" alt="Foto kenangan">

            <img id="photoRight" src="gambar_1 (2).jpeg" alt="Foto kenangan">

        </div>

    </section>


    <!-- =========================================
         BAGIAN 5
         HEART PHOTO COLLAGE
    ========================================== -->

    <section id="finalSection">

        <div id="photoHeart"></div>

        <div class="final-text">
            ❤️ FOR YOU ❤️
        </div>

    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
